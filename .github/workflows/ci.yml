name: CI
on:
  push:
    paths-ignore: ['**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -c requirements-lock.txt -r requirements.txt
      - run: alembic upgrade head
      - run: python tests/check_contract.py
      - run: python tests/check_upgrade.py
      - run: python -m pip check
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip --no-deps --strict -r requirements-lock.txt
      - run: python -m pytest -q
