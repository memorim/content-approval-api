services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: approval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - approval_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d approval"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/approval
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    build: .
    command: ["python", "-m", "app.outbox"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/approval
      OUTBOX_DIRECTORY: /delivery/events
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - approval_delivery:/delivery
    restart: unless-stopped

volumes:
  approval_pg_data:
  approval_delivery:
